[workspace]
authors = ["sangarshanan <sangarshanan@gmail.com>"]
channels = ["conda-forge"]
name = "chladni"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
circle_particle = "python -m src.runner examples/1_audioreactive_circle_particles.py"
camera_effects = "python -m src.runner examples/2_gesture_camera_effects.py"
audioreactive_tunnel = "python -m src.runner examples/3_audioreactive_tunnel.py"
camera_filters = "python -m src.runner examples/4_gesture_camera_isf_filters.py"
kaleidoscope = "python -m src.runner examples/5_audioreactive_kaleidoscope.py"
shader = "python -m src.runner examples/6_shader_audio_gesture.py"
hoopdreams = "python -m src.runner examples/7_audioreactive_hoopdreams.py"

[dependencies]
python = ">=3.15"
numpy = "==2.5.4"
moderngl = "==5.13.0"
pyglfw = "==2.11.0"
python-sounddevice = "==0.5.6"
opencv = "==5.0.0"

[pypi-dependencies]
mediapipe = "==1.2.0"